
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASH 5 | Instruction Manual</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #151515;
  color: #eee;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 20px 10px;
  letter-spacing: 3px;
  font-size: 14px;
}

#viewer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  min-height: 0;
  overflow: hidden;
}

#book {
  margin: auto;
}

.page {
  background: #fff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  padding: 20px;
}

button {
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 4px;
  padding: 12px 24px;
  font-size: 20px;
  cursor: pointer;
}

button:hover {
  background: #555;
}

button:disabled {
  opacity: .3;
}

#counter {
  color: #aaa;
  font-size: 13px;
  min-width: 75px;
  text-align: center;
}

#message {
  text-align: center;
  color: #aaa;
  padding: 30px;
  line-height: 1.8;
}

@media(max-width:650px) {
  header {
    font-size: 12px;
  }

  #viewer {
    padding: 5px;
  }

  #controls {
    gap: 22px;
  }

  button {
    padding: 12px 20px;
  }
}
</style>
</head>

<body>

<header>CLASH 5 — INSTRUCTION MANUAL</header>

<div id="message">説明書を読み込んでいます...</div>

<main id="viewer">
  <div id="book"></div>
</main>

<div id="controls">
  <button id="prev" aria-label="前のページ">❮</button>
  <span id="counter">0 / 0</span>
  <button id="next" aria-label="次のページ">❯</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script type="module">

import * as pdfjsLib from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

const bookElement = document.getElementById("book");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

let pageFlip = null;
let pdf = null;

const PAGE_WIDTH = 600;
const PAGE_HEIGHT = 800;

async function init() {

  try {

    message.textContent = "PDFを読み込んでいます...";

    // PDF読み込み
    pdf = await pdfjsLib.getDocument("./manual.pdf").promise;

    message.textContent = "ページを準備しています...";

    // PDFの各ページをHTMLに変換
    for (let i = 1; i <= pdf.numPages; i++) {

      const pdfPage = await pdf.getPage(i);

      const viewport = pdfPage.getViewport({ scale: 1 });

      const scale = Math.min(
        PAGE_WIDTH / viewport.width,
        PAGE_HEIGHT / viewport.height
      );

      const scaledViewport = pdfPage.getViewport({
        scale: scale
      });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      const ratio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(scaledViewport.width * ratio);
      canvas.height = Math.round(scaledViewport.height * ratio);

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      await pdfPage.render({
        canvasContext: context,
        viewport: scaledViewport,
        transform: [ratio, 0, 0, ratio, 0, 0]
      }).promise;

      const page = document.createElement("div");

      page.className = "page";

      // 表紙と最終ページは硬い表紙として扱う
      if (i === 1 || i === pdf.numPages) {
        page.dataset.density = "hard";
      }

      page.appendChild(canvas);
      bookElement.appendChild(page);

    }

    // PDF読み込み完了
    message.style.display = "none";

    // 3Dページめくりを初期化
    pageFlip = new St.PageFlip(bookElement, {

      width: PAGE_WIDTH,
      height: PAGE_HEIGHT,

      size: "stretch",

      minWidth: 280,
      maxWidth: 1200,

      minHeight: 350,
      maxHeight: 1200,

      drawShadow: true,
      maxShadowOpacity: 0.45,

      flippingTime: 600,

      usePortrait: true,
      showCover: true,

      mobileScrollSupport: false,
      swipeDistance: 30,

      showPageCorners: true,
      disableFlipByClick: false

    });

    pageFlip.loadFromHTML(
      bookElement.querySelectorAll(".page")
    );

    // ページ番号更新
    pageFlip.on("flip", updateCounter);

    pageFlip.on("init", updateCounter);

    updateCounter();

  } catch (error) {

    console.error(error);

    message.style.display = "block";

    message.textContent =
      "説明書を読み込めませんでした。manual.pdf の配置を確認してください。";

  }

}

function updateCounter() {

  if (!pageFlip) return;

  const current = pageFlip.getCurrentPageIndex();

  const total = pageFlip.getPageCount();

  counter.textContent =
    `${current + 1} / ${total}`;

  prev.disabled = current === 0;
  next.disabled = current >= total - 1;

}

// 左右ボタン
prev.addEventListener("click", () => {
  if (pageFlip) {
    pageFlip.flipPrev("top");
  }
});

next.addEventListener("click", () => {
  if (pageFlip) {
    pageFlip.flipNext("top");
  }
});

// キーボード操作
document.addEventListener("keydown", event => {

  if (!pageFlip) return;

  if (event.key === "ArrowLeft") {
    pageFlip.flipPrev("top");
  }

  if (event.key === "ArrowRight") {
    pageFlip.flipNext("top");
  }

});

init();

</script>

</body>
</html>
