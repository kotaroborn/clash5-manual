<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASH 5 MANUAL</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #171717;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 14px 16px 8px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #c9c9c9;
    }

    #viewer {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #book {
      margin: 0 auto;
    }

    .page {
      background: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 12px 16px 22px;
    }

    button {
      appearance: none;
      border: 1px solid #777;
      background: #292929;
      color: #fff;
      min-width: 100px;
      padding: 11px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #page-count {
      min-width: 72px;
      text-align: center;
      color: #ddd;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    #status {
      padding: 0 16px 14px;
      color: #aaa;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header { padding-top: 10px; }
      #viewer { padding: 6px; }
      #controls { gap: 10px; padding-bottom: 16px; }
      button { min-width: 82px; padding: 10px 12px; }
    }
  </style>
</head>

<body>
  <header>CLASH 5 OFFICIAL MANUAL</header>

  <main id="viewer">
    <div id="book"></div>
  </main>

  <nav id="controls" aria-label="ページ操作">
    <button id="prev" type="button">戻る</button>
    <span id="page-count">読み込み中</span>
    <button id="next" type="button">次へ</button>
  </nav>

  <div id="status">マニュアルを読み込んでいます…</div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const PDF_URL = "./manual.pdf";
    const bookElement = document.getElementById("book");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const pageCount = document.getElementById("page-count");
    const status = document.getElementById("status");

    let pageFlip = null;
    let totalPages = 0;

    function updateControls(currentPage) {
      pageCount.textContent = `${currentPage + 1} / ${totalPages}`;
      prevButton.disabled = currentPage <= 0;
      nextButton.disabled = currentPage >= totalPages - 1;
    }

    async function buildManual() {
      try {
        const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdf.numPages;

        // PDFの実際の縦横比を1ページ目から取得する
        const firstPage = await pdf.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1 });
        const aspectRatio = baseViewport.width / baseViewport.height;

        // 画面サイズに合わせて本の寸法を決める
        const availableWidth = Math.min(window.innerWidth - 28, 1100);
        const availableHeight = Math.max(300, window.innerHeight - 150);

        let pageWidth = Math.min(availableWidth / 2, 600);
        let pageHeight = pageWidth / aspectRatio;

        if (pageHeight > availableHeight) {
          pageHeight = availableHeight;
          pageWidth = pageHeight * aspectRatio;
        }

        // スマートフォンでは1ページ表示にする
        const isNarrow = window.innerWidth <= 700;
        if (isNarrow) {
          pageWidth = Math.min(window.innerWidth - 20, 600);
          pageHeight = pageWidth / aspectRatio;
          if (pageHeight > availableHeight) {
            pageHeight = availableHeight;
            pageWidth = pageHeight * aspectRatio;
          }
        }

        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
          const pdfPage = pageNumber === 1 ? firstPage : await pdf.getPage(pageNumber);
          const viewport = pdfPage.getViewport({
            scale: (pageWidth * pixelRatio) / baseViewport.width
          });

          const pageElement = document.createElement("div");
          pageElement.className = "page";

          // HARD指定は一切付けない。表紙も通常ページと同じ3D紙めくりにする。
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d", { alpha: false });

          canvas.width = Math.round(viewport.width);
          canvas.height = Math.round(viewport.height);

          await pdfPage.render({
            canvasContext: context,
            viewport
          }).promise;

          pageElement.appendChild(canvas);
          bookElement.appendChild(pageElement);
        }

        status.textContent = "";

        // showCover:false が重要。
        // trueにすると表紙が硬いページ扱いになり、通常ページと動きが変わる。
        pageFlip = new St.PageFlip(bookElement, {
          width: Math.round(pageWidth),
          height: Math.round(pageHeight),
          size: "fixed",
          minWidth: 240,
          maxWidth: 1200,
          minHeight: 300,
          maxHeight: 1600,
          drawShadow: true,
          maxShadowOpacity: 0.35,
          flippingTime: 700,
          usePortrait: true,
          startPage: 0,
          showCover: false,
          mobileScrollSupport: false,
          swipeDistance: 30,
          showPageCorners: true,
          disableFlipByClick: false,
          autoSize: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));
        pageFlip.on("flip", (event) => updateControls(event.data));
        updateControls(0);

        // 進む・戻るともに同じStPageFlipの3D反転機能を使用する
        nextButton.addEventListener("click", () => pageFlip.flipNext("top"));
        prevButton.addEventListener("click", () => pageFlip.flipPrev("top"));

        document.addEventListener("keydown", (event) => {
          if (event.key === "ArrowRight") pageFlip.flipNext("top");
          if (event.key === "ArrowLeft") pageFlip.flipPrev("top");
        });
      } catch (error) {
        console.error(error);
        status.textContent =
          "読み込みに失敗しました。manual.pdf が index.html と同じ場所にあるか確認してください。";
      }
    }

    buildManual();
  </script>
</body>
</html>
