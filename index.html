
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASH 5 | Instruction Manual</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151515;
  color: #eee;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 18px 10px;
  letter-spacing: 3px;
  font-size: 14px;
  flex-shrink: 0;
}

#viewer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 8px;
  overflow: hidden;
}

#book {
  margin: auto;
}

/* PDFページ */
.page {
  background: #fff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* 操作ボタン */
#controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  padding: 18px;
  flex-shrink: 0;
}

button {
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 4px;
  padding: 12px 24px;
  font-size: 20px;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: #555;
}

button:disabled {
  opacity: .25;
  cursor: default;
}

#counter {
  color: #aaa;
  font-size: 13px;
  min-width: 75px;
  text-align: center;
}

#message {
  text-align: center;
  color: #aaa;
  padding: 30px;
}

@media(max-width:650px) {
  header {
    font-size: 12px;
  }

  #viewer {
    padding: 3px;
  }

  #controls {
    gap: 22px;
  }

  button {
    padding: 12px 20px;
  }
}
</style>
</head>

<body>

<header>CLASH 5 — INSTRUCTION MANUAL</header>

<div id="message">説明書を読み込んでいます...</div>

<main id="viewer">
  <div id="book"></div>
</main>

<div id="controls">
  <button id="prev" aria-label="前のページ">❮</button>
  <span id="counter">0 / 0</span>
  <button id="next" aria-label="次のページ">❯</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script type="module">

import * as pdfjsLib from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

const bookElement = document.getElementById("book");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

let pageFlip = null;
let pdf = null;
let pageWidth = 600;
let pageHeight = 800;

async function init() {

  try {

    message.textContent = "PDFを読み込んでいます...";

    pdf = await pdfjsLib.getDocument("./manual.pdf").promise;

    // PDF本来の縦横比を取得
    const firstPage = await pdf.getPage(1);
    const originalSize = firstPage.getViewport({scale: 1});

    const aspectRatio =
      originalSize.width / originalSize.height;

    // ページサイズをPDFに合わせる
    pageWidth = 600;
    pageHeight = Math.round(pageWidth / aspectRatio);

    // 各ページを画像化
    for (let i = 1; i <= pdf.numPages; i++) {

      const pdfPage = await pdf.getPage(i);

      const baseViewport = pdfPage.getViewport({
        scale: 1
      });

      const renderScale = pageWidth / baseViewport.width;

      const viewport = pdfPage.getViewport({
        scale: renderScale
      });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      const ratio = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      canvas.width = Math.round(viewport.width * ratio);
      canvas.height = Math.round(viewport.height * ratio);

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      await pdfPage.render({
        canvasContext: context,
        viewport: viewport,
        transform: [ratio, 0, 0, ratio, 0, 0]
      }).promise;

      const page = document.createElement("div");
      page.className = "page";

      if (i === 1 || i === pdf.numPages) {
        page.dataset.density = "hard";
      }

      page.appendChild(canvas);
      bookElement.appendChild(page);
    }

    message.style.display = "none";

    // 3Dブックを初期化
    pageFlip = new St.PageFlip(bookElement, {

      width: pageWidth,
      height: pageHeight,

      size: "stretch",

      minWidth: 280,
      maxWidth: 1200,

      minHeight: 300,
      maxHeight: 1200,

      drawShadow: true,
      maxShadowOpacity: 0.35,

      flippingTime: 600,

      usePortrait: true,
      showCover: true,

      mobileScrollSupport: false,
      swipeDistance: 30,

      showPageCorners: true,
      disableFlipByClick: false

    });

    pageFlip.loadFromHTML(
      bookElement.querySelectorAll(".page")
    );

    pageFlip.on("flip", updateCounter);
    pageFlip.on("init", updateCounter);

    updateCounter();

  } catch (error) {

    console.error(error);

    message.style.display = "block";
    message.textContent =
      "説明書を読み込めませんでした。manual.pdfを確認してください。";

  }
}

// ページ番号更新
function updateCounter() {

  if (!pageFlip) return;

  const current = pageFlip.getCurrentPageIndex();
  const total = pageFlip.getPageCount();

  counter.textContent =
    `${current + 1} / ${total}`;

  prev.disabled = current === 0;
  next.disabled = current >= total - 1;
}

// 前後とも同じ3D回転でめくる
prev.addEventListener("click", () => {

  if (pageFlip && pageFlip.getCurrentPageIndex() > 0) {
    pageFlip.flipPrev("top");
  }

});

next.addEventListener("click", () => {

  if (
    pageFlip &&
    pageFlip.getCurrentPageIndex() < pageFlip.getPageCount() - 1
  ) {
    pageFlip.flipNext("top");
  }

});

// キーボード操作
document.addEventListener("keydown", event => {

  if (!pageFlip) return;

  if (event.key === "ArrowLeft") {
    pageFlip.flipPrev("top");
  }

  if (event.key === "ArrowRight") {
    pageFlip.flipNext("top");
  }

});

init();

</script>

</body>
</html>
